services:
  db:
    image: postgres:16-alpine
    env_file:
      - docker_compose/.env.postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-15433}:${POSTGRES_PORT:-15433}"
    entrypoint:
      - sh
      - -c
      - exec docker-entrypoint.sh postgres -c "listen_addresses=*" -p "$${POSTGRES_PORT:-15433}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h $${POSTGRES_HOST:-127.0.0.1} -p $${POSTGRES_PORT:-15433} -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker_compose/Dockerfile
    env_file:
      - docker_compose/.env.postgres
      - docker_compose/.env.api_uvicorn
    environment:
      POSTGRES_HOST: db
    ports:
      - "${API_PUBLISH_HOST:-127.0.0.1}:${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
