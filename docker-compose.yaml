services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:-tasks_dev_pgs_db}
      POSTGRES_USER: ${POSTGRES_USER:-pgs_dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgs_dev_password}
    ports:
      - "${POSTGRES_HOST_PORT:-15433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker_compose/Dockerfile
    env_file:
      - .env.postgres
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic -c alembic/alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
